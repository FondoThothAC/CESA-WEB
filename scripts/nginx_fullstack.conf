server {
    listen 80;
    server_name cesaunison.fondothoth.com www.cesaunison.fondothoth.com cesa-unison.duckdns.org cesa.unison.mx;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name cesaunison.fondothoth.com www.cesaunison.fondothoth.com cesa-unison.duckdns.org cesa.unison.mx;

    ssl_certificate /etc/letsencrypt/live/cesaunison.fondothoth.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cesaunison.fondothoth.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Frontend: Salida estática de Next.js
    root /var/www/cesa-web/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Simulador Pedimento
    location /pedimento {
        alias /var/www/cesa-web/backend/public/pedimento;
        index index.html;
        try_files $uri $uri/ /pedimento/index.html;
    }

    # PWA: Shell Maestro de PHP y pantallas interactivas
    location /pwa {
        alias /var/www/cesa-web/backend/public;
        index index.php;
        try_files $uri $uri/ /pwa/index.php?$query_string;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    # Microservicio de Node.js (Motor IA y Orquestador Social)
    location /api/ia/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 30s;
    }

    location /api/social/ {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # Nuevo Backend Unificado en Rust (Axum Port 8080)
    location /api/v1/ {
        proxy_pass http://127.0.0.1:8080/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 60s;
    }

    # Backend: API en PHP
    location /api {
        alias /var/www/cesa-web/backend/api;
        index index.php health.php;

        location ~ \.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/var/run/php/php8.3-fpm.sock;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            
            # Pasar Authorization header a PHP para leer JWT
            fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        }
    }

    # Seguridad: Bloquear archivos sensibles
    location ~ /\.(?!well-known).* {
        deny all;
    }

    error_log  /var/log/nginx/cesa_fullstack_error.log;
    access_log /var/log/nginx/cesa_fullstack_access.log;
}
