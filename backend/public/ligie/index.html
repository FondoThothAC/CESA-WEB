<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta TIGIE 2022 - SIICEX Clone</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar glass-panel">
            <div class="sidebar-header">
                <div class="logo-container">
                    <i data-lucide="book-open" class="logo-icon"></i>
                    <h2>TIGIE <span>2022</span></h2>
                </div>
                <div class="search-box">
                    <i data-lucide="search"></i>
                    <input type="text" id="searchInput" placeholder="Buscar fracción o texto...">
                </div>
            </div>
            
            <nav class="tree-nav" id="treeNav">
                <!-- Tree will be populated here via JS -->
                <div class="loading-state">
                    <div class="spinner"></div>
                    <p>Cargando LIGIE...</p>
                </div>
            </nav>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="topbar glass-panel">
                <div class="breadcrumb" id="breadcrumb">
                    <span>SECCIÓN</span>
                    <i data-lucide="chevron-right"></i>
                    <span>CAPÍTULO</span>
                    <i data-lucide="chevron-right"></i>
                    <span>PARTIDA</span>
                </div>
            </header>
            
            <section class="content-view glass-panel" id="contentView">
                <div class="welcome-message">
                    <i data-lucide="globe-2" class="huge-icon"></i>
                    <h1>Sistema de Consulta LIGIE 2022</h1>
                    <p>Selecciona un capítulo o partida en el menú lateral para explorar la tarifa actualizada, o utiliza el buscador para encontrar fracciones arancelarias rápidamente.</p>
                </div>
                <!-- Dynamic Content Will Appear Here -->
            </section>
        </main>
    </div>

    <!-- Background decorative elements -->
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="bg-shape shape-3"></div>

    <script src="data.js"></script>
    <script src="js/app.js"></script>
    <script>
      lucide.createIcons();
    </script>
</body>
</html>
